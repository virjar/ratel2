name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runner 预装 Android SDK（ANDROID_HOME 已设、license 已接受），
      # 只补装本项目需要的组件（不用 setup-android action——它强制安装已被
      # 仓库下架的旧 tools 包，exit 1）
      - name: 安装 SDK 组件（cmake / android-37 / NDK r30）
        run: |
          set -x
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "cmake;3.31.6" "platforms;android-37" > /dev/null
          # NDK r30 不在 stable 仓库（lsplant C++23 modules 需要，NDK 27 clang 不支持）
          # ——直接官方直链下载解压，目录名对齐 AGP ndkVersion 钉的 revision
          curl -sfLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          mkdir -p $ANDROID_HOME/ndk-tmp
          unzip -q /tmp/ndk.zip -d $ANDROID_HOME/ndk-tmp
          mv $ANDROID_HOME/ndk-tmp/android-ndk-r30 $ANDROID_HOME/ndk/30.0.16248370
          rmdir $ANDROID_HOME/ndk-tmp

      - name: 构建
        run: ./gradlew build --no-daemon

      - name: 工具链 dist 自检（init → 模块编译链资源齐备）
        run: |
          ./gradlew :toolchain:installDist --no-daemon
          jar tf toolchain/build/install/ratel/lib/toolchain-*.jar | grep -q "ratel/runtime.dex"
          jar tf toolchain/build/install/ratel/lib/toolchain-*.jar | grep -q "ratel/sdk/ratel-sdk.jar"
          jar tf toolchain/build/install/ratel/lib/toolchain-*.jar | grep -q "ratel/wrapper/gradlew"
