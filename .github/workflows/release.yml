name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu runner 预装 Android SDK（同 ci.yml，不用 setup-android action）
      - name: 安装 SDK 组件（cmake / android-37 / NDK r30）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager "cmake;3.31.6" "platforms;android-37" > /dev/null
          # NDK r30 不在 stable 仓库（lsplant C++23 modules 需要，NDK 27 clang 不支持）
          # ——直接官方直链下载解压，目录名对齐 AGP ndkVersion 钉的 revision
          curl -sfLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          mkdir -p $ANDROID_HOME/ndk-tmp
          unzip -q /tmp/ndk.zip -d $ANDROID_HOME/ndk-tmp
          mv $ANDROID_HOME/ndk-tmp/android-ndk-r30 $ANDROID_HOME/ndk/30.0.16248370
          rmdir $ANDROID_HOME/ndk-tmp

      - name: 构建工具链 dist
        run: ./gradlew :toolchain:installDist --no-daemon

      - name: 打发布包（ratel-<tag>.zip）
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd toolchain/build/install
          zip -r "../ratel-${VERSION}.zip" ratel

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toolchain/build/ratel-*.zip
          generate_release_notes: true
