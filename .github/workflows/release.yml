name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（NDK 30 / cmake / android-37）
        run: sdkmanager "ndk;30.0.16248370" "cmake;3.31.6" "platforms;android-37" > /dev/null

      - name: 构建工具链 dist
        run: ./gradlew :toolchain:installDist --no-daemon

      - name: 打发布包（ratel-<tag>.zip）
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd toolchain/build/install
          zip -r "../ratel-${VERSION}.zip" ratel

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toolchain/build/ratel-*.zip
          generate_release_notes: true
